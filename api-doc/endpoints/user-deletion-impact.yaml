get:
  summary: Preview user deletion impact (admin only)
  operationId: getUserDeletionImpact
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Deletion impact preview
      content:
        application/vnd.api+json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserDeletionImpactSingleResponse
    '401':
      description: Unauthorized
      content:
        application/vnd.api+json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
    '403':
      description: Admin access required
      content:
        application/vnd.api+json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
    '404':
      description: User not found
      content:
        application/vnd.api+json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
