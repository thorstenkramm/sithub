openapi: 3.1.0
info:
  title: SitHub API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://example.com/license
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /api-keys:
    $ref: ./endpoints/api-keys.yaml
  /api-keys/{id}:
    $ref: ./endpoints/api-key.yaml
  /ping:
    $ref: ./endpoints/ping.yaml
  /settings:
    $ref: ./endpoints/settings.yaml
  /areas:
    $ref: ./endpoints/areas.yaml
  /areas/{area_id}/item-groups:
    $ref: ./endpoints/item-groups.yaml
  /areas/{area_id}/item-groups/availability:
    $ref: ./endpoints/item-group-availability.yaml
  /areas/{area_id}/item-groups/matrix:
    $ref: ./endpoints/item-group-matrix.yaml
  /areas/{area_id}/presence:
    $ref: ./endpoints/area-presence.yaml
  /item-groups/{item_group_id}/items:
    $ref: ./endpoints/items.yaml
  /item-groups/{item_group_id}/bookings:
    $ref: ./endpoints/item-group-bookings.yaml
  /bookings:
    $ref: ./endpoints/bookings.yaml
  /bookings/history:
    $ref: ./endpoints/bookings-history.yaml
  /bookings/export:
    $ref: ./endpoints/bookings-export.yaml
  /bookings/export.csv:
    $ref: ./endpoints/bookings-export-csv.yaml
  /bookings/{booking_id}:
    $ref: ./endpoints/booking.yaml
  /me:
    $ref: ./endpoints/me.yaml
  /auth/login:
    $ref: ./endpoints/auth-login.yaml
  /auth/logout:
    $ref: ./endpoints/auth-logout.yaml
  /auth/providers:
    $ref: ./endpoints/auth-providers.yaml
  /users:
    $ref: ./endpoints/users.yaml
  /users/{user_id}:
    $ref: ./endpoints/user.yaml
  /users/{user_id}/deletion-impact:
    $ref: ./endpoints/user-deletion-impact.yaml
  /avatars/{user_id}:
    $ref: ./endpoints/avatars.yaml
  /me/avatar:
    $ref: ./endpoints/me-avatar.yaml
  /floor-plans/{filename}:
    $ref: ./endpoints/floor-plans.yaml
  /floor-plan-positions:
    $ref: ./endpoints/floor-plan-positions.yaml
  /floor-plan-positions/{id}:
    $ref: ./endpoints/floor-plan-position.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: >-
        Administrator-created API key with read-bookings scope. Grants access only to the JSON and CSV
        booking exports. Bearer credentials override cookies; malformed, unknown, revoked or expired
        keys return 401 without cookie fallback. See docs/public-api.md.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sithub_user
  parameters:
    ExportFrom:
      name: filter[from]
      in: query
      required: true
      description: First booking date, inclusive.
      schema:
        type: string
        format: date
    ExportTo:
      name: filter[to]
      in: query
      required: true
      description: Last booking date, inclusive. Must not be before `filter[from]`.
      schema:
        type: string
        format: date
    ExportArea:
      name: filter[area]
      in: query
      required: false
      description: ID of a top-level area. Omit or leave empty for all areas.
      schema:
        type: string
    PageLimit:
      name: page[limit]
      in: query
      required: false
      description: Maximum number of resources per page. Values above 100 are capped to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: page[offset]
      in: query
      required: false
      description: Number of resources to skip before the first returned resource.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ApiKeyAttributes:
      type: object
      required: [name, key_prefix, scope, expires_at, created_at, created_by]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        key_prefix:
          type: string
          minLength: 10
          maxLength: 10
          description: First 10 characters of the key, including the dash.
        scope:
          type: string
          enum: [read-bookings]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Creating administrator's user ID.
    ApiKeyResource:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [api-keys]
        attributes:
          $ref: '#/components/schemas/ApiKeyAttributes'
    ApiKeyCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [api-keys]
            attributes:
              type: object
              required: [name, scope, expires_in_months]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed before validation. Duplicate names are allowed.
                scope:
                  type: string
                  enum: [read-bookings]
                expires_in_months:
                  type: integer
                  enum: [3, 12, 24]
                  description: Calendar months from creation in UTC; overflowing days normalize into the next month.
    ApiKeyCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResource'
    ApiKeyCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/ApiKeyResource'
            - type: object
              properties:
                attributes:
                  type: object
                  required: [key]
                  properties:
                    key:
                      type: string
                      format: uuid
                      description: Random UUID v4 plaintext key. Returned only once, in this creation response.
    PaginationMeta:
      type: object
      description: Top-level meta of a paginated collection.
      properties:
        total:
          type: integer
          description: Total number of resources across all pages
        limit:
          type: integer
          description: Effective page size (after capping)
        offset:
          type: integer
          description: Offset of the first resource in this page
      required:
        - total
        - limit
        - offset
    PaginationLinks:
      type: object
      description: >-
        Relative pagination links. Query parameters other than page[limit] and page[offset] are preserved.
        prev and next are null when there is no previous or next page.
      properties:
        self:
          type: string
        first:
          type: string
        prev:
          type:
            - string
            - 'null'
        next:
          type:
            - string
            - 'null'
        last:
          type: string
      required:
        - self
        - first
        - prev
        - next
        - last
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorObject'
      required:
        - errors
    ErrorObject:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        detail:
          type: string
        code:
          type: string
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
    SingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Resource'
      required:
        - data
    AreaAttributes:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        floor_plan:
          type: string
      required:
        - name
    AreaResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: areas
            attributes:
              $ref: '#/components/schemas/AreaAttributes'
          required:
            - type
            - attributes
    AreaCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaResource'
      required:
        - data
    ItemGroupAttributes:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        floor_plan:
          type: string
      required:
        - name
    ItemGroupResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: item-groups
            attributes:
              $ref: '#/components/schemas/ItemGroupAttributes'
          required:
            - type
            - attributes
    ItemGroupCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemGroupResource'
      required:
        - data
    ItemAttributes:
      type: object
      properties:
        name:
          type: string
        equipment:
          type: array
          items:
            type: string
        availability:
          type: string
          enum:
            - available
            - occupied
        warning:
          type: string
        booking_id:
          type: string
          description: Booking ID (admin only, present when occupied)
        booker_name:
          type: string
          description: Name of user who booked (present when occupied)
        booker_user_id:
          type: string
          description: User ID of the booking owner (present when occupied and not a guest booking)
        booked_by_me:
          type: boolean
          description: True when the current authenticated user owns the booking for this item
        note:
          type: string
          description: Booking note (present when occupied and note is not empty)
        reserved:
          type: boolean
          description: True when the current authenticated user cannot book this item because it is reserved for other users
      required:
        - name
        - equipment
        - availability
    ItemResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: items
            attributes:
              $ref: '#/components/schemas/ItemAttributes'
          required:
            - type
            - attributes
    ItemCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemResource'
      required:
        - data
    CreateBookingRequestAttributes:
      type: object
      properties:
        item_id:
          type: string
          description: ID of the item to book
        booking_date:
          type: string
          format: date
          description: Date to book the item (YYYY-MM-DD), for single-day bookings
        booking_dates:
          type: array
          items:
            type: string
            format: date
          description: >
            Array of dates to book (YYYY-MM-DD), for multi-day bookings.
            Use either booking_date or booking_dates, not both.
        for_user_id:
          type: string
          description: >
            Optional. ID of another user to book on behalf of.
            The user must exist in the system.
        for_user_name:
          type: string
          description: >
            Optional. Display name for the booking target.
            Required for guest bookings (when is_guest is true).
        is_guest:
          type: boolean
          description: >
            Optional. Set to true to create a guest booking.
            Requires for_user_name.
        guest_email:
          type: string
          format: email
          description: Optional contact email for guest bookings.
        note:
          type: string
          maxLength: 500
          description: Optional free-text note to attach to the booking (max 500 characters).
      required:
        - item_id
    CreateBookingRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              const: bookings
            attributes:
              $ref: '#/components/schemas/CreateBookingRequestAttributes'
          required:
            - type
            - attributes
      required:
        - data
    BookingAttributes:
      type: object
      properties:
        item_id:
          type: string
        user_id:
          type: string
        booking_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        note:
          type: string
          description: Free-text note attached to the booking (max 500 characters)
        booked_by_user_id:
          type: string
          description: ID of the user who created the booking (present when different from user_id)
        is_guest:
          type: boolean
          description: Whether this is a guest booking
        guest_email:
          type: string
          description: Contact email for guest bookings
      required:
        - item_id
        - user_id
        - booking_date
        - created_at
        - note
    BookingResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: bookings
            attributes:
              $ref: '#/components/schemas/BookingAttributes'
          required:
            - type
            - attributes
    BookingSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookingResource'
      required:
        - data
    FloorPlanPositionAttributes:
      type: object
      properties:
        floor_plan:
          type: string
        item_id:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        border_width:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - floor_plan
        - item_id
        - x
        - y
        - width
        - height
        - border_width
        - created_at
        - updated_at
    FloorPlanPositionResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: floor-plan-positions
            attributes:
              $ref: '#/components/schemas/FloorPlanPositionAttributes'
          required:
            - type
            - attributes
    FloorPlanPositionCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FloorPlanPositionResource'
      required:
        - data
    FloorPlanPositionSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FloorPlanPositionResource'
      required:
        - data
    FloorPlanPositionCreateAttributes:
      type: object
      properties:
        floor_plan:
          type: string
        item_id:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        border_width:
          type: integer
      required:
        - floor_plan
        - item_id
        - x
        - y
        - width
        - height
    FloorPlanPositionCreateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              const: floor-plan-positions
            attributes:
              $ref: '#/components/schemas/FloorPlanPositionCreateAttributes'
          required:
            - type
            - attributes
      required:
        - data
    FloorPlanPositionUpdateAttributes:
      type: object
      properties:
        label:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        border_width:
          type: integer
    FloorPlanPositionUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              const: floor-plan-positions
            attributes:
              $ref: '#/components/schemas/FloorPlanPositionUpdateAttributes'
          required:
            - type
            - attributes
      required:
        - data
    MyBookingAttributes:
      type: object
      properties:
        item_id:
          type: string
        item_name:
          type: string
        item_group_id:
          type: string
        item_group_name:
          type: string
        area_id:
          type: string
        area_name:
          type: string
        booking_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        note:
          type: string
          description: Free-text note attached to the booking (max 500 characters)
        booked_by_user_id:
          type: string
          description: ID of the user who made the booking (empty if self-booked)
        booked_by_user_name:
          type: string
          description: Name of the user who made the booking (empty if self-booked)
        booked_for_me:
          type: boolean
          description: >
            True if this booking was made on behalf of the current user
            by someone else. False for self-bookings or bookings the
            current user made for others.
        for_user_id:
          type: string
          description: >
            ID of the colleague this booking was made for. Present only on
            bookings the current user made on a colleague's behalf.
        for_user_name:
          type: string
          description: >
            Display name of the colleague this booking was made for. Present
            only on bookings the current user made on a colleague's behalf.
        is_guest:
          type: boolean
          description: Whether this is a guest booking
        guest_name:
          type: string
          description: Display name for guest bookings
        guest_email:
          type: string
          description: Contact email for guest bookings
      required:
        - item_id
        - item_name
        - item_group_id
        - item_group_name
        - area_id
        - area_name
        - booking_date
        - created_at
        - note
        - booked_by_user_id
        - booked_by_user_name
        - booked_for_me
    MyBookingResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: bookings
            attributes:
              $ref: '#/components/schemas/MyBookingAttributes'
          required:
            - type
            - attributes
    MyBookingsCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyBookingResource'
      required:
        - data
    ItemGroupBookingAttributes:
      type: object
      properties:
        item_id:
          type: string
        item_name:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        booking_date:
          type: string
          format: date
        note:
          type: string
          description: Free-text note attached to the booking
      required:
        - item_id
        - item_name
        - user_id
        - user_name
        - booking_date
        - note
    ItemGroupBookingResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: bookings
            attributes:
              $ref: '#/components/schemas/ItemGroupBookingAttributes'
          required:
            - type
            - attributes
    ItemGroupBookingsCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemGroupBookingResource'
      required:
        - data
    AreaPresenceAttributes:
      type: object
      properties:
        user_id:
          type: string
        user_name:
          type: string
        item_id:
          type: string
        item_name:
          type: string
        item_group_id:
          type: string
        item_group_name:
          type: string
        note:
          type: string
          description: Free-text note attached to the booking
      required:
        - user_id
        - user_name
        - item_id
        - item_name
        - item_group_id
        - item_group_name
        - note
    AreaPresenceResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: presence
            attributes:
              $ref: '#/components/schemas/AreaPresenceAttributes'
          required:
            - type
            - attributes
    AreaPresenceCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaPresenceResource'
      required:
        - data
    UserAttributes:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        is_data_exporter:
          type: boolean
          description: >-
            Grants access to booking data export. Independent of is_admin; administrators do not
            implicitly hold it. Read from the database on every request, so changes apply without re-login.
        auth_source:
          type: string
          enum:
            - internal
            - entraid
        role:
          type: string
          enum:
            - admin
            - user
        last_login:
          type: string
          format: date-time
          description: Timestamp of last successful login (empty if never logged in)
        deleted:
          type: boolean
          description: Whether the user is deactivated and blocked from sign-in/colleague selection
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - email
        - display_name
        - is_admin
        - is_data_exporter
        - auth_source
        - role
        - deleted
    UserResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: users
            attributes:
              $ref: '#/components/schemas/UserAttributes'
          required:
            - type
            - attributes
    UserSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResource'
      required:
        - data
    BookingExportAttributes:
      type: object
      properties:
        booking_date:
          type: string
          format: date
        user_id:
          type: string
          description: >-
            ID of the person the booking is for, usable with the avatar endpoint. Empty for guest
            bookings and when the user no longer exists.
        user_name:
          type: string
          description: Name of the person the booking is for (guest name for guest bookings)
        user_email:
          type: string
          description: Email of the person the booking is for (empty for guests without email)
        is_guest:
          type: boolean
        item_id:
          type: string
        item_name:
          type: string
        item_group_id:
          type: string
        item_group_name:
          type: string
        area_id:
          type: string
        area_name:
          type: string
        booked_item:
          type: string
          description: Item group name and item name, e.g. "Cube 1 / Tisch 3"
      required:
        - booking_date
        - user_id
        - user_name
        - user_email
        - is_guest
        - item_id
        - item_name
        - item_group_id
        - item_group_name
        - area_id
        - area_name
        - booked_item
    BookingExportResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: bookings
            attributes:
              $ref: '#/components/schemas/BookingExportAttributes'
          required:
            - type
            - attributes
    BookingExportCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookingExportResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
        - data
        - meta
        - links
    UserCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
        - data
        - meta
        - links
    UserDeletionImpactAttributes:
      type: object
      properties:
        has_bookings:
          type: boolean
        future_booking_count:
          type: integer
          minimum: 0
        mode:
          type: string
          enum:
            - delete
            - deactivate
      required:
        - has_bookings
        - future_booking_count
        - mode
    UserDeletionImpactResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: user-deletion-impacts
            attributes:
              $ref: '#/components/schemas/UserDeletionImpactAttributes'
          required:
            - type
            - attributes
    UserDeletionImpactSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserDeletionImpactResource'
      required:
        - data
    CreateUserRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              const: users
            attributes:
              type: object
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                password:
                  type: string
                  minLength: 14
                is_admin:
                  type: boolean
              required:
                - email
                - display_name
                - password
          required:
            - type
            - attributes
      required:
        - data
    UpdateUserRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            attributes:
              type: object
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                is_admin:
                  type: boolean
                is_data_exporter:
                  type: boolean
                  description: Grant or revoke the data exporter role. Omit to keep the current value.
                password:
                  type: string
                  minLength: 14
                  description: Admin password reset (local users only)
          required:
            - attributes
      required:
        - data
    UpdateBookingRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              const: bookings
            id:
              type: string
            attributes:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: Free-text note (max 500 characters)
              required:
                - note
          required:
            - type
            - id
            - attributes
      required:
        - data
    ChangePasswordRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            attributes:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 14
              required:
                - current_password
                - new_password
          required:
            - attributes
      required:
        - data
    DayAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        weekday:
          type: string
          description: Two-letter weekday abbreviation (MO, TU, WE, TH, FR)
          enum:
            - MO
            - TU
            - WE
            - TH
            - FR
        total:
          type: integer
          description: Total number of items in the group
        available:
          type: integer
          description: Number of items available (not booked) on this day
      required:
        - date
        - weekday
        - total
        - available
    ItemGroupAvailabilityAttributes:
      type: object
      properties:
        item_group_id:
          type: string
        item_group_name:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayAvailability'
      required:
        - item_group_id
        - item_group_name
        - days
    ItemGroupAvailabilityResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: item-group-availability
            attributes:
              $ref: '#/components/schemas/ItemGroupAvailabilityAttributes'
          required:
            - type
            - attributes
    ItemGroupAvailabilityCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemGroupAvailabilityResource'
      required:
        - data
    MatrixDayMeta:
      type: object
      properties:
        date:
          type: string
          format: date
        weekday:
          type: string
          description: Two-letter weekday abbreviation
          enum:
            - MO
            - TU
            - WE
            - TH
            - FR
            - SA
            - SU
      required:
        - date
        - weekday
    MatrixCell:
      type: object
      properties:
        date:
          type: string
          format: date
        availability:
          type: string
          enum:
            - free
            - occupied
        booker_name:
          type: string
          description: Display name of the booker (present when occupied)
        booker_user_id:
          type: string
          description: User ID of the booker (present when occupied and not a guest)
        booked_by_me:
          type: boolean
          description: True when the current user owns the booking
        booking_id:
          type: string
          description: Booking ID (present only for the booking owner or admins)
      required:
        - date
        - availability
        - booked_by_me
    MatrixItem:
      type: object
      properties:
        item_id:
          type: string
        item_name:
          type: string
        equipment:
          type: array
          items:
            type: string
        warning:
          type: string
        reserved:
          type: boolean
          description: True when the item is reserved for other users
        cells:
          type: array
          items:
            $ref: '#/components/schemas/MatrixCell'
      required:
        - item_id
        - item_name
        - equipment
        - cells
    ItemGroupMatrixAttributes:
      type: object
      properties:
        item_group_id:
          type: string
        item_group_name:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/MatrixDayMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatrixItem'
      required:
        - item_group_id
        - item_group_name
        - days
        - items
    ItemGroupMatrixResource:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            type:
              const: item-group-weekly-matrix
            attributes:
              $ref: '#/components/schemas/ItemGroupMatrixAttributes'
          required:
            - type
            - attributes
    ItemGroupMatrixCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemGroupMatrixResource'
      required:
        - data
